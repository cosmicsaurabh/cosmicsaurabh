<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Saurabh - Mobile and AI Systems Engineer</title>
  <desc id="description">A blue and violet engineering banner showing a mobile client connected to local storage, an AI workflow, and backend services.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#172554"/>
      <stop offset="0.72" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#BFDBFE" stroke-opacity="0.075"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="68" r="230" fill="url(#glow)"/>
  <circle cx="714" cy="340" r="180" fill="url(#glow)" opacity="0.45"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="72" fill="#93C5FD" font-size="16" font-weight="700" letter-spacing="3.2">MOBILE · AI PRODUCT ENGINEERING · BACKEND</text>
    <text x="72" y="139" fill="#FFFFFF" font-size="52" font-weight="750">Saurabh</text>
    <text x="72" y="180" fill="#E0E7FF" font-size="22">2+ years shipping production Flutter and AI-powered systems.</text>
    <text x="72" y="214" fill="#BFDBFE" font-size="17">mobile ownership · typed AI workflows · backend integration · reliability</text>

    <g transform="translate(72 244)">
      <rect width="108" height="34" rx="17" fill="url(#chip)" stroke="#BFDBFE" stroke-opacity="0.45"/>
      <text x="54" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">FLUTTER</text>
      <rect x="120" width="142" height="34" rx="17" fill="url(#chip)" stroke="#BFDBFE" stroke-opacity="0.45"/>
      <text x="191" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">PRODUCTION AI</text>
      <rect x="274" width="126" height="34" rx="17" fill="url(#chip)" stroke="#BFDBFE" stroke-opacity="0.45"/>
      <text x="337" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">NODE.JS / TS</text>
    </g>
  </g>

  <g transform="translate(752 42)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="M142 66C178 66 188 90 188 112" fill="none" stroke="#C4B5FD" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M142 157C178 157 188 146 188 132" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M142 245C180 245 188 191 188 154" fill="none" stroke="#DDD6FE" stroke-width="2.5" stroke-dasharray="6 6"/>

    <g filter="url(#softGlow)">
      <circle cx="188" cy="112" r="4" fill="#93C5FD"/>
      <circle cx="188" cy="132" r="4" fill="#C4B5FD"/>
      <circle cx="188" cy="154" r="4" fill="#DDD6FE"/>
    </g>

    <g>
      <rect x="0" y="38" width="142" height="56" rx="14" fill="#0F172A" fill-opacity="0.86" stroke="#60A5FA" stroke-opacity="0.72"/>
      <text x="18" y="62" fill="#93C5FD" font-size="12" font-weight="700" letter-spacing="1.5">LOCAL</text>
      <text x="18" y="82" fill="#FFFFFF" font-size="15" font-weight="650">SQLite + files</text>

      <rect x="0" y="128" width="142" height="56" rx="14" fill="#0F172A" fill-opacity="0.86" stroke="#818CF8" stroke-opacity="0.72"/>
      <text x="18" y="152" fill="#A5B4FC" font-size="12" font-weight="700" letter-spacing="1.5">AI FLOW</text>
      <text x="18" y="172" fill="#FFFFFF" font-size="15" font-weight="650">Tools + streaming</text>

      <rect x="0" y="218" width="142" height="56" rx="14" fill="#0F172A" fill-opacity="0.86" stroke="#C084FC" stroke-opacity="0.72"/>
      <text x="18" y="242" fill="#D8B4FE" font-size="12" font-weight="700" letter-spacing="1.5">BACKEND</text>
      <text x="18" y="262" fill="#FFFFFF" font-size="15" font-weight="650">API + PostgreSQL</text>
    </g>

    <g transform="translate(188 0)">
      <rect width="190" height="248" rx="30" fill="#020617" fill-opacity="0.92" stroke="#BFDBFE" stroke-width="2"/>
      <rect x="13" y="17" width="164" height="214" rx="20" fill="#0F172A" stroke="#334155"/>
      <rect x="69" y="7" width="52" height="6" rx="3" fill="#64748B"/>
      <circle cx="95" cy="218" r="5" fill="#475569"/>

      <rect x="31" y="41" width="128" height="52" rx="14" fill="#1D4ED8" fill-opacity="0.4" stroke="#60A5FA"/>
      <text x="95" y="63" text-anchor="middle" fill="#DBEAFE" font-size="11" font-weight="700" letter-spacing="1.2">MOBILE CLIENT</text>
      <text x="95" y="82" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Flutter</text>

      <rect x="31" y="104" width="128" height="28" rx="9" fill="#1E3A8A" stroke="#60A5FA"/>
      <text x="95" y="122" text-anchor="middle" fill="#DBEAFE" font-size="11.5" font-weight="650">stream · response</text>

      <rect x="31" y="141" width="128" height="28" rx="9" fill="#312E81" stroke="#A5B4FC"/>
      <text x="95" y="159" text-anchor="middle" fill="#E0E7FF" font-size="11.5" font-weight="650">tool · typed action</text>

      <rect x="31" y="178" width="128" height="28" rx="9" fill="#4C1D95" stroke="#C084FC"/>
      <text x="95" y="196" text-anchor="middle" fill="#F3E8FF" font-size="11.5" font-weight="650">retry · cancel · recover</text>
    </g>
  </g>
</svg>
